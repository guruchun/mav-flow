# GitHub Actions workflow for automated releases
# v* 태그가 푸시되면 Windows 릴리즈를 빌드하고 GitHub Release를 생성합니다.

name: Build and Release

on:
  push:
    tags:
      - 'v*'

permissions:
  contents: write

jobs:
  build-windows:
    runs-on: windows-latest
    
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true

      - name: Get dependencies
        run: flutter pub get

      - name: Analyze code
        run: flutter analyze

      - name: Build Windows release
        run: flutter build windows --release

      - name: Extract version from tag
        id: version
        shell: pwsh
        run: |
          $version = "${{ github.ref_name }}" -replace '^v', ''
          echo "VERSION=$version" >> $env:GITHUB_OUTPUT

      - name: Create ZIP archive
        shell: pwsh
        run: |
          $version = "${{ steps.version.outputs.VERSION }}"
          $sourcePath = "build\windows\x64\runner\Release"
          $zipName = "mav-flow-$version-windows-x64.zip"
          
          # ZIP 아카이브 생성
          Compress-Archive -Path "$sourcePath\*" -DestinationPath $zipName -Force
          
          Write-Host "Created: $zipName"
          Get-ChildItem $zipName

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          files: mav-flow-*.zip
          generate_release_notes: true
          draft: false
          prerelease: ${{ contains(github.ref_name, '-') }}
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
