# SCU-MG3 Message Specification
# Extracted from message-spec.xlsx (PPC Tx - SCU Data columns)
# Packet: Header(1) + Payload(Base+FuelCell+Cells) + CRC8(1) + Tail(1)
# Byte order: Big-Endian
# Value encoding: original_value + dmi_offset (decode: (raw - dmi_offset) * scale_factor)
# scale_factor is derived from Excel "Calculate" column formulas

packet:
  header: 0xFE
  tail: 0xFF
  crc8_polynomial: 0x07
  payload_size: 480  # Base(100) + FuelCell(150) + Cells(230)

