name: mav_flow
description: MG3 SCU Serial Monitor — real-time packet monitoring tool
publish_to: 'none'
version: 1.0.0+1

environment:
  sdk: '>=3.0.0 <4.0.0'

dependencies:
  flutter:
    sdk: flutter
  flutter_libserialport: ^0.6.0
  yaml: ^3.1.2
  provider: ^6.1.2
  xml: ^7.1.0
  file_selector: ^1.0.3
  package_info_plus: ^8.0.0
  http: ^1.2.0
  url_launcher: ^6.2.0
  path: ^1.9.0

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0

flutter:
  uses-material-design: true
  assets:
    - assets/mavlink/
    - assets/config/
